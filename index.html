<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業員別 一括Web予定表管理システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="text-slate-800 bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // LocalStorage から設定を取得（未設定時はデフォルト値）
        const DEFAULT_URL = "https://uahtfbuwzpwguuwgewno.supabase.co";
        const DEFAULT_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhaHRmYnV3enB3Z3V1d2dld25vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODA5NzEsImV4cCI6MjEwODY1Njk3MX0.jt2kp5iv9-GWs4BAZcBnKLSUJpgHbp8rQxoRlMZdh5A";

        const { useState, useEffect } = React;

        function App() {
            const [url, setUrl] = useState(() => localStorage.getItem('cfg_sp_url') || DEFAULT_URL);
            const [key, setKey] = useState(() => localStorage.getItem('cfg_sp_key') || DEFAULT_KEY);
            const [client, setClient] = useState(null);
            const [status, setStatus] = useState('未接続');
            const [logs, setLogs] = useState([]);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                if (url && key) {
                    try {
                        const c = window.supabase.createClient(url, key);
                        setClient(c);
                        testConnection(c);
                    } catch (e) {
                        setStatus(`初期化エラー: ${e.message}`);
                    }
                }
            }, [url, key]);

            const log = (msg, isErr = false) => {
                setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${isErr ? '❌ ' : 'ℹ️ '}${msg}`, ...prev.slice(0, 20)]);
            };

            const testConnection = async (c) => {
                setStatus('接続テスト中...');
                log('Supabase 接続テスト開始...');
                const { data, error } = await c.from('workers').select('count', { count: 'exact', head: true });
                if (error) {
                    setStatus(`接続失敗: ${error.message}`);
                    log(`接続失敗 [${error.code || 'NO_CODE'}]: ${error.message}`, true);
                } else {
                    setStatus('正常接続');
                    log('Supabase への認証・通信テスト成功！');
                }
            };

            const handleSaveConfig = () => {
                localStorage.setItem('cfg_sp_url', url.trim());
                localStorage.setItem('cfg_sp_key', key.trim());
                setShowSettings(false);
                log('接続設定を更新しました');
            };

            const handleTestWrite = async () => {
                if (!client) return;
                log('書き込みテスト（workers テーブル）実行中...');
                const testWorker = {
                    worker_id: 'test_' + Date.now(),
                    full_name: 'テスト作業員',
                    role_name: '動作確認',
                    color_code: 'bg-blue-600'
                };
                const { error } = await client.from('workers').upsert(testWorker);
                if (error) {
                    log(`保存エラー: ${error.message} (${error.details || error.code})`, true);
                } else {
                    log('正常に保存できました！(書き込み権限OK)');
                }
            };

            return (
                <div className="p-6 max-w-4xl mx-auto space-y-4">
                    <header className="bg-slate-900 text-white p-4 rounded-xl flex justify-between items-center">
                        <div>
                            <h1 className="font-bold text-lg">Supabase 接続診断・管理コンソール</h1>
                            <p className="text-xs text-slate-400">Status: <span className={status === '正常接続' ? 'text-emerald-400 font-bold' : 'text-amber-400 font-bold'}>{status}</span></p>
                        </div>
                        <button onClick={() => setShowSettings(!showSettings)} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded text-xs font-bold border border-slate-700">
                            ⚙️ 接続設定を変更
                        </button>
                    </header>

                    {showSettings && (
                        <div className="bg-white p-4 rounded-xl border border-slate-300 space-y-3 text-xs">
                            <h2 className="font-bold text-slate-800">Supabase API 設定</h2>
                            <div>
                                <label className="block text-slate-600 font-bold mb-1">Project URL</label>
                                <input type="text" value={url} onChange={e => setUrl(e.target.value)} className="w-full border p-2 rounded font-mono" />
                            </div>
                            <div>
                                <label className="block text-slate-600 font-bold mb-1">API Key (anon / public)</label>
                                <textarea rows="3" value={key} onChange={e => setKey(e.target.value)} className="w-full border p-2 rounded font-mono break-all" />
                            </div>
                            <div className="flex gap-2 justify-end">
                                <button onClick={() => { setUrl(DEFAULT_URL); setKey(DEFAULT_KEY); }} className="px-3 py-1.5 bg-slate-200 rounded font-bold">初期値に戻す</button>
                                <button onClick={handleSaveConfig} className="px-4 py-1.5 bg-blue-600 text-white rounded font-bold">設定保存 & 再接続</button>
                            </div>
                        </div>
                    )}

                    <div className="flex gap-2">
                        <button onClick={() => client && testConnection(client)} className="px-4 py-2 bg-slate-800 text-white rounded-lg text-xs font-bold hover:bg-slate-700">
                            🔄 接続再テスト
                        </button>
                        <button onClick={handleTestWrite} className="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-500">
                            📝 書き込みテスト実行
                        </button>
                    </div>

                    <div className="bg-slate-950 text-emerald-400 p-4 rounded-xl font-mono text-xs h-64 overflow-y-auto space-y-1">
                        <div className="text-slate-500 font-bold border-b border-slate-800 pb-1 mb-2">--- 診断ログ ---</div>
                        {logs.length === 0 ? <div className="text-slate-600">ログなし</div> : logs.map((l, i) => <div key={i}>{l}</div>)}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
