<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業員一括Web予定表システム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen font-sans antialiased selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // =============================================================================
        //  【Supabase 接続設定箇所】
        // =============================================================================
        const SUPABASE_URL = "https://uahtfbuwzpwguuwgewno.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhaHRmYnV3enB3Z3V1d2dld25vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4NTI4NzEsImV4cCI6MjA1NDQyODg3MX0.jt2kp5iv9-GWs4BAZckQO-Q-m8aWfP15R-3iMsh3fR0";

        let supabaseClient = null;
        try {
            if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error("Supabase client init error:", e);
        }

        // 初期作業員リスト (15名)
        const DEFAULT_WORKERS = [
            { id: 'w1', name: '久保田 一', role: '現場担当' },
            { id: 'w2', name: '山路 泰靖', role: '現場担当' },
            ...Array.from({ length: 13 }, (_, i) => ({
                id: `w${i + 3}`,
                name: `作業員 ${i + 3}`,
                role: '現場担当'
            }))
        ];

        const TIME_SLOTS = ['07:00', '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];

        function App() {
            // ロック・認証ステート
            const [isLocked, setIsLocked] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [pin, setPin] = useState('');
            const [pinError, setPinError] = useState('');

            // アプリ基本ステート
            const [workers, setWorkers] = useState(DEFAULT_WORKERS);
            const [schedules, setSchedules] = useState([]);
            const [dbConnected, setDbConnected] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');
            const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [searchQuery, setSearchQuery] = useState('');
            const [activeTab, setActiveTab] = useState('board'); // 'board' | 'matrix' | 'list' | 'stats'

            // モーダル管理
            const [showScheduleModal, setShowScheduleModal] = useState(false);
            const [showWorkerModal, setShowWorkerModal] = useState(false);
            const [editingSchedule, setEditingSchedule] = useState(null);

            // フォーム用ステート
            const [formWorkerId, setFormWorkerId] = useState('w1');
            const [formTitle, setFormTitle] = useState('');
            const [formStartTime, setFormStartTime] = useState('08:00');
            const [formEndTime, setFormEndTime] = useState('17:00');
            const [formLocation, setFormLocation] = useState('');
            const [formStatus, setFormStatus] = useState('not_started'); // 'completed' | 'in_progress' | 'not_started'
            const [formNotes, setFormNotes] = useState('');

            // アイコン初期化
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, isLocked, showScheduleModal, showWorkerModal, showAuthModal, schedules]);

            // DBから初期データ取得
            useEffect(() => {
                fetchData();
            }, []);

            const showError = (msg) => {
                setErrorMessage(msg);
                setTimeout(() => setErrorMessage(""), 6000);
            };

            const fetchData = async () => {
                if (!supabaseClient) return;

                try {
                    // 1. 作業員マスタ読み込み
                    const { data: wData, error: wErr } = await supabaseClient.from('workers').select('*').order('created_at', { ascending: true });
                    if (wErr) throw wErr;

                    if (wData && wData.length > 0) {
                        setWorkers(wData.map(w => ({
                            id: w.worker_id || w.id,
                            name: w.name,
                            role: w.role || '現場担当'
                        })));
                    } else {
                        // テーブル空時に自動初期化
                        const payload = DEFAULT_WORKERS.map(w => ({ worker_id: w.id, name: w.name, role: w.role }));
                        await supabaseClient.from('workers').insert(payload);
                    }

                    // 2. 予定データ読み込み
                    const { data: sData, error: sErr } = await supabaseClient.from('schedules').select('*');
                    if (sErr) throw sErr;

                    if (sData) {
                        setSchedules(sData.map(s => ({
                            id: s.schedule_id || s.id,
                            workerId: s.worker_id,
                            date: s.work_date || s.date,
                            startTime: s.start_time || s.startTime,
                            endTime: s.end_time || s.endTime,
                            title: s.title,
                            location: s.location || '',
                            status: s.status || 'not_started',
                            notes: s.notes || ''
                        })));
                    }

                    setDbConnected(true);
                } catch (err) {
                    console.error("Fetch Data Error:", err);
                    showError(`DB通信エラー: ${err.message || err}`);
                }
            };

            // 日付移動関数
            const shiftDate = (days) => {
                const current = new Date(selectedDate);
                current.setDate(current.getDate() + days);
                setSelectedDate(current.toISOString().split('T')[0]);
            };

            // 日本語日付フォーマット
            const formattedDateText = useMemo(() => {
                if (!selectedDate) return '';
                const [y, m, d] = selectedDate.split('-').map(Number);
                const dateObj = new Date(y, m - 1, d);
                const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][dateObj.getDay()];
                return `${y}年${m}月${d}日 (${dayOfWeek})`;
            }, [selectedDate]);

            // セルクリックでの即時割り当て呼び出し
            const handleCellClick = (workerId, timeSlot) => {
                if (isLocked) {
                    showError("画面がロックされています。「ロック解除」を行ってください。");
                    return;
                }
                resetForm();
                setFormWorkerId(workerId);
                setFormStartTime(timeSlot);
                // 1時間後の終了時間を算出
                const hour = parseInt(timeSlot.split(':')[0], 10);
                const endHour = Math.min(hour + 1, 20);
                setFormEndTime(`${endHour.toString().padStart(2, '0')}:00`);
                setShowScheduleModal(true);
            };

            // 予定保存
            const handleSaveSchedule = async (e) => {
                e.preventDefault();
                if (!formTitle.trim()) return;

                const newSched = {
                    schedule_id: editingSchedule ? editingSchedule.id : `s_${Date.now()}`,
                    worker_id: formWorkerId,
                    work_date: selectedDate,
                    start_time: formStartTime,
                    end_time: formEndTime,
                    title: formTitle,
                    location: formLocation,
                    status: formStatus,
                    notes: formNotes
                };

                try {
                    const { error } = await supabaseClient.from('schedules').upsert([newSched]);
                    if (error) throw error;

                    await fetchData();
                    setShowScheduleModal(false);
                    resetForm();
                } catch (err) {
                    showError(`保存失敗: ${err.message || err}`);
                }
            };

            const resetForm = () => {
                setEditingSchedule(null);
                setFormTitle('');
                setFormLocation('');
                setFormNotes('');
                setFormStartTime('08:00');
                setFormEndTime('17:00');
                setFormStatus('not_started');
            };

            // フィルタリング処理
            const filteredSchedules = useMemo(() => {
                return schedules.filter(s => {
                    const matchDate = s.date === selectedDate;
                    const matchSearch = searchQuery.trim() === '' ||
                        s.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (s.location && s.location.toLowerCase().includes(searchQuery.toLowerCase()));
                    return matchDate && matchSearch;
                });
            }, [schedules, selectedDate, searchQuery]);

            // ロック画面
            if (isLocked) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 text-white">
                        <div className="bg-slate-800 p-8 rounded-2xl border border-slate-700 max-w-sm w-full text-center shadow-2xl">
                            <div className="w-16 h-16 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="lock" className="w-8 h-8"></i>
                            </div>
                            <h2 className="text-xl font-bold mb-2">画面がロックされています</h2>
                            <p className="text-xs text-slate-400 mb-6">誤操作防止のため操作が制限されています</p>
                            <button
                                onClick={() => setIsLocked(false)}
                                className="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition"
                            >
                                ロックを解除する
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col font-sans">
                    {/* メインダークヘッダー */}
                    <header className="bg-slate-900 text-white px-6 py-3.5 shadow-md flex flex-wrap justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-xl text-white shadow-md">
                                <i data-lucide="users" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <div className="flex items-center gap-3">
                                    <h1 className="text-lg font-black tracking-wide">作業員一括Web予定表システム</h1>
                                    <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold flex items-center gap-1 border ${
                                        dbConnected ? 'bg-emerald-950/80 text-emerald-400 border-emerald-500/50' : 'bg-amber-950/80 text-amber-400 border-amber-500/50'
                                    }`}>
                                        <i data-lucide="database" className="w-3.5 h-3.5"></i>
                                        {dbConnected ? 'Supabase DB接続完了' : '接続処理中...'}
                                    </span>
                                </div>
                                <p className="text-[11px] text-slate-400">全作業員の予定データをリアルタイムで同期・保存します</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <button
                                onClick={() => { resetForm(); setShowScheduleModal(true); }}
                                className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold shadow flex items-center gap-1.5 transition"
                            >
                                <i data-lucide="plus" className="w-4 h-4"></i> 新規予定割当
                            </button>
                            <button
                                onClick={fetchData}
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium flex items-center gap-1.5 transition"
                            >
                                <i data-lucide="refresh-cw" className="w-3.5 h-3.5 text-emerald-400"></i> データ再読み込み
                            </button>
                            <button
                                onClick={() => setShowWorkerModal(true)}
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-xs font-medium flex items-center gap-1.5 transition"
                            >
                                <i data-lucide="settings" className="w-3.5 h-3.5"></i> 作業員マスタ (15名)
                            </button>
                            <button
                                onClick={() => setShowAuthModal(true)}
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 rounded-lg text-xs font-medium flex items-center gap-1.5 transition"
                            >
                                <i data-lucide="fingerprint" className="w-3.5 h-3.5"></i> 認証設定
                            </button>
                            <button
                                onClick={() => setIsLocked(true)}
                                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 border border-slate-700 rounded-lg text-xs font-medium flex items-center gap-1.5 transition"
                            >
                                <i data-lucide="lock" className="w-3.5 h-3.5"></i> ロック
                            </button>
                        </div>
                    </header>

                    {/* エラー通知ポップアップ */}
                    {errorMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-rose-900 text-rose-100 border border-rose-700 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 max-w-md animate-bounce">
                            <i data-lucide="alert-triangle" className="w-5 h-5 text-rose-400"></i>
                            <div className="text-xs font-semibold">{errorMessage}</div>
                        </div>
                    )}

                    {/* サブコントローラーバー (日付選択 / 検索 / タブ) */}
                    <div className="bg-slate-100 px-6 py-3 border-b border-slate-200 flex flex-wrap justify-between items-center gap-4">
                        <div className="flex items-center gap-2">
                            <button onClick={() => shiftDate(-1)} className="p-1.5 bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 transition">
                                <i data-lucide="chevron-left" className="w-4 h-4"></i>
                            </button>
                            <input
                                type="date"
                                value={selectedDate}
                                onChange={(e) => setSelectedDate(e.target.value)}
                                className="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-bold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500"
                            />
                            <button onClick={() => shiftDate(1)} className="p-1.5 bg-white border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 transition">
                                <i data-lucide="chevron-right" className="w-4 h-4"></i>
                            </button>
                            <button
                                onClick={() => setSelectedDate(new Date().toISOString().split('T')[0])}
                                className="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50 transition ml-1"
                            >
                                本日
                            </button>
                            <span className="text-sm font-bold text-slate-800 ml-2">{formattedDateText}</span>
                        </div>

                        <div className="flex items-center gap-3">
                            <div className="relative">
                                <i data-lucide="search" className="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-400"></i>
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="作業名・現場で検索..."
                                    className="pl-8 pr-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500 w-52"
                                />
                            </div>

                            <div className="flex bg-slate-200 p-0.5 rounded-lg border border-slate-300">
                                <button
                                    onClick={() => setActiveTab('board')}
                                    className={`px-3 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 ${
                                        activeTab === 'board' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <i data-lucide="users" className="w-3.5 h-3.5"></i> 一括ボード
                                </button>
                                <button
                                    onClick={() => setActiveTab('matrix')}
                                    className={`px-3 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 ${
                                        activeTab === 'matrix' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <i data-lucide="grid" className="w-3.5 h-3.5"></i> 週間マトリクス
                                </button>
                                <button
                                    onClick={() => setActiveTab('list')}
                                    className={`px-3 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 ${
                                        activeTab === 'list' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <i data-lucide="list" className="w-3.5 h-3.5"></i> 予定一覧
                                </button>
                                <button
                                    onClick={() => setActiveTab('stats')}
                                    className={`px-3 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 ${
                                        activeTab === 'stats' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <i data-lucide="bar-chart-2" className="w-3.5 h-3.5"></i> 集計
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* メインコンテンツエリア */}
                    <main className="flex-1 p-6">
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            {/* サブタイトル & 凡例 */}
                            <div className="px-5 py-2.5 bg-slate-50 border-b border-slate-200 flex justify-between items-center text-xs">
                                <div className="font-bold text-slate-700">
                                    当日配置作業員: <span className="text-blue-600 font-extrabold">15名</span>
                                    <span className="text-slate-400 font-normal ml-3">| セルクリックで即時割り当て</span>
                                </div>
                                <div className="flex items-center gap-4 text-slate-600 font-medium">
                                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 完了</span>
                                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span> 作業中</span>
                                    <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-slate-400"></span> 未着手</span>
                                </div>
                            </div>

                            {/* 15名時間軸ガントチャートグリッド */}
                            <div className="overflow-x-auto">
                                <table className="w-full border-collapse text-left">
                                    <thead>
                                        <tr className="bg-slate-900 text-white text-[11px] font-bold divide-x divide-slate-800">
                                            <th className="p-2.5 w-48 min-w-[190px]">作業員氏名・職種 (15名)</th>
                                            {TIME_SLOTS.map(time => (
                                                <th key={time} className="p-2.5 text-center w-20 min-w-[70px]">{time}</th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-200 text-xs">
                                        {workers.map((worker) => {
                                            const wSchedules = filteredSchedules.filter(s => s.workerId === worker.id);
                                            return (
                                                <tr key={worker.id} className="hover:bg-slate-50/80 transition divide-x divide-slate-200">
                                                    {/* 作業員名列 */}
                                                    <td className="p-2.5 bg-slate-50 font-bold text-slate-800">
                                                        <div className="flex items-center justify-between">
                                                            <div>
                                                                <div className="text-sm font-black text-slate-800">{worker.name}</div>
                                                                <div className="text-[10px] text-slate-400 font-normal">{worker.role}</div>
                                                            </div>
                                                            <span className="px-2 py-0.5 bg-slate-200 text-slate-600 rounded text-[10px] font-bold">
                                                                {wSchedules.length}件
                                                            </span>
                                                        </div>
                                                    </td>

                                                    {/* 時間軸セル */}
                                                    {TIME_SLOTS.map(timeSlot => {
                                                        const matchedScheds = wSchedules.filter(s => s.startTime <= timeSlot && s.endTime > timeSlot);
                                                        return (
                                                            <td
                                                                key={timeSlot}
                                                                onClick={() => handleCellClick(worker.id, timeSlot)}
                                                                className="p-1 h-12 cursor-pointer hover:bg-blue-50/50 transition relative"
                                                            >
                                                                {matchedScheds.map(s => (
                                                                    <div
                                                                        key={s.id}
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            setEditingSchedule(s);
                                                                            setFormWorkerId(s.workerId);
                                                                            setFormTitle(s.title);
                                                                            setFormStartTime(s.startTime);
                                                                            setFormEndTime(s.endTime);
                                                                            setFormLocation(s.location);
                                                                            setFormStatus(s.status);
                                                                            setFormNotes(s.notes);
                                                                            setShowScheduleModal(true);
                                                                        }}
                                                                        className={`p-1 rounded text-[10px] font-bold leading-tight shadow-sm border overflow-hidden cursor-pointer ${
                                                                            s.status === 'completed' ? 'bg-emerald-100 text-emerald-900 border-emerald-300' :
                                                                            s.status === 'in_progress' ? 'bg-blue-100 text-blue-900 border-blue-300' :
                                                                            'bg-slate-100 text-slate-800 border-slate-300'
                                                                        }`}
                                                                    >
                                                                        <div className="truncate">{s.title}</div>
                                                                        {s.location && <div className="text-[9px] opacity-75 truncate">📍 {s.location}</div>}
                                                                    </div>
                                                                ))}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {/* 予定登録・編集モーダル */}
                    {showScheduleModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-200">
                                <h3 className="text-base font-bold text-slate-900 mb-4 flex items-center gap-2">
                                    <i data-lucide="calendar" className="w-5 h-5 text-blue-600"></i>
                                    {editingSchedule ? '予定の編集' : '新規予定割当'}
                                </h3>
                                <form onSubmit={handleSaveSchedule} className="space-y-3.5 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">対象作業員</label>
                                        <select
                                            value={formWorkerId}
                                            onChange={e => setFormWorkerId(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 font-bold outline-none focus:ring-2 focus:ring-blue-500"
                                        >
                                            {workers.map(w => <option key={w.id} value={w.id}>{w.name} ({w.role})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">件名・作業内容</label>
                                        <input
                                            type="text"
                                            required
                                            value={formTitle}
                                            onChange={e => setFormTitle(e.target.value)}
                                            placeholder="例: 高圧配線工事"
                                            className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">開始時間</label>
                                            <input type="time" value={formStartTime} onChange={e => setFormStartTime(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">終了時間</label>
                                            <input type="time" value={formEndTime} onChange={e => setFormEndTime(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">作業場所</label>
                                            <input type="text" value={formLocation} onChange={e => setFormLocation(e.target.value)} placeholder="例: 2F 電気室" className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-600 mb-1">ステータス</label>
                                            <select value={formStatus} onChange={e => setFormStatus(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg font-bold">
                                                <option value="not_started">⚪ 未着手</option>
                                                <option value="in_progress">🔵 作業中</option>
                                                <option value="completed">🟢 完了</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">備考</label>
                                        <textarea value={formNotes} onChange={e => setFormNotes(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg h-20 outline-none"></textarea>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setShowScheduleModal(false)} className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg transition">キャンセル</button>
                                        <button type="submit" className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow transition">保存する</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
