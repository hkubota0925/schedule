                clipboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 022 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />,

                shield: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,

                lock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />,
                smartphone: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />,
                key: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />,
                filter: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />,
                grid: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            };
            return (
                <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {icons[name] || icons.calendar}
                </svg>
            );
        };

        // --- Helper Date & Time Functions ---
        const getTodayString = () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatDateJP = (dateStr) => {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 (${days[d.getDay()]})`;
        };

        const addDaysStr = (dateStr, daysCount) => {
            const d = new Date(dateStr);
            d.setDate(d.getDate() + daysCount);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const addMinutes = (timeStr, mins) => {
            if (!timeStr) return '10:00';
            const [h, m] = timeStr.split(':').map(Number);
            const d = new Date();
            d.setHours(h, m + mins);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        };

        const getDurationMinutes = (startTime, endTime) => {
            if (!startTime || !endTime) return 120;
            const [h1, m1] = startTime.split(':').map(Number);
            const [h2, m2] = endTime.split(':').map(Number);
            const diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            return diff > 0 ? diff : 120;
        };

        const TIME_SLOTS = [
            '07:00', '08:00', '09:00', '10:00', '11:00', '12:00',
            '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'
        ];

        // --- CLEAN INITIAL WORKER MASTER (15 WORKERS) ---
        const INITIAL_WORKERS = Array.from({ length: 15 }, (_, i) => ({
            id: `w${i + 1}`,
            name: `作業員 ${i + 1}`,
            role: '現場担当',
            color: 'bg-blue-600',
            badgeCls: 'bg-blue-100 text-blue-800 border-blue-300'
        }));

        // --- MAIN APP COMPONENT ---
        function App() {
            const [dbConnected, setDbConnected] = useState(false);

            // Security / Authentication States
            const [authSettings, setAuthSettings] = useState(() => {
                const saved = localStorage.getItem('app_auth_settings');
                return saved ? JSON.parse(saved) : {
                    useBiometrics: true,
                    use2FA: true,
                    pin: '1234'
                };
            });

            const [isAuthenticated, setIsAuthenticated] = useState(() => {
                return sessionStorage.getItem('app_is_authenticated') === 'true';
            });

            // Active View & Date State
            const [selectedDate, setSelectedDate] = useState(getTodayString());
            const [currentView, setCurrentView] = useState('timeline');
            const [density, setDensity] = useState('compact');
            const [searchQuery, setSearchQuery] = useState('');

            // Modals & Forms
            const [isSecurityModalOpen, setIsSecurityModalOpen] = useState(false);
            const [isWorkerMasterOpen, setIsWorkerMasterOpen] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isExportModalOpen, setIsExportModalOpen] = useState(false);
            const [editingSchedule, setEditingSchedule] = useState(null);
            const [toast, setToast] = useState(null);

            // --- COPY, PASTE & UNDO HISTORY STATES ---
            const [copiedSchedule, setCopiedSchedule] = useState(null);
            const [selectedScheduleId, setSelectedScheduleId] = useState(null);
            const [activeCell, setActiveCell] = useState(null); // { workerId, timeSlot }
            const [historyStack, setHistoryStack] = useState([]); // Stack of actions for Ctrl+Z Undo

            // Persistent Master Data
            const [workers, setWorkers] = useState(() => {
                const saved = localStorage.getItem('app_workers_master');
                return saved ? JSON.parse(saved) : INITIAL_WORKERS;
            });

            const [schedules, setSchedules] = useState(() => {
                const saved = localStorage.getItem('app_schedules_master');
                return saved ? JSON.parse(saved) : [];
            });

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 5000);
            };

            // --- SUPABASE DYNAMIC SYNC & INITIAL SEEDING ---
            const fetchSupabaseData = async () => {
                if (!supabase) return;
                try {
                    // 1. Fetch Workers from Supabase
                    const { data: wData, error: wErr } = await supabase
                        .from('workers')
                        .select('*')
                        .eq('is_deleted', false)
                        .order('display_order', { ascending: true });
                    
                    if (wErr) {
                        console.error('Fetch Workers Error:', wErr);
                        setDbConnected(false);
                        showToast(`DB読み込み失敗 (Workers): ${wErr.message}`, 'error');
                        return;
                    } else if (wData && wData.length > 0) {
                        const formattedW = wData.map(w => ({
                            id: String(w.worker_id || w.id),
                            name: w.full_name || w.name,
                            role: w.role_name || w.role,
                            color: w.color_code || 'bg-blue-600',
                            badgeCls: 'bg-blue-100 text-blue-800'
                        }));
                        setWorkers(formattedW);
                    } else {
                        // Seed Workers Table in Supabase if Empty
                        const seedPayload = INITIAL_WORKERS.map((w, idx) => ({
                            worker_id: String(w.id),
                            worker_code: String(w.id),
                            full_name: w.name,
                            role_name: w.role,
                            color_code: w.color,
                            display_order: idx + 1,
                            is_deleted: false
                        }));
                        const { error: seedErr } = await supabase.from('workers').upsert(seedPayload);
                        if (seedErr) {
                            console.error('Seed Workers Error:', seedErr);
                        } else {
                            setWorkers(INITIAL_WORKERS);
                        }
                    }

                    // 2. Fetch Schedules from Supabase
                    const { data: sData, error: sErr } = await supabase
                        .from('schedules')
                        .select('*')
                        .eq('is_deleted', false);

                    if (sErr) {
                        console.error('Fetch Schedules Error:', sErr);
                        setDbConnected(false);
                        showToast(`DB読み込み失敗 (Schedules): ${sErr.message}`, 'error');
                        return;
                    } else if (sData) {
                        const formattedS = sData.map(s => ({
                            id: String(s.schedule_id || s.id),
                            date: s.work_date || s.date,
                            workerId: String(s.worker_id || s.workerId),
                            startTime: s.start_time ? s.start_time.slice(0, 5) : '08:00',
                            endTime: s.end_time ? s.end_time.slice(0, 5) : '17:00',
                            title: s.title,
                            location: s.location || '',
                            priority: s.priority || 'medium',
                            status: s.status || 'not_started',
                            category: s.category || 'work',
                            notes: s.notes || ''
                        }));
                        setSchedules(formattedS);
                    }

                    setDbConnected(true);
                } catch (e) {
                    console.error('Supabase Init Error:', e);
                    setDbConnected(false);
                    showToast(`Supabase通信例外: ${e.message}`, 'error');
                }
            };

            useEffect(() => {
                fetchSupabaseData();
            }, []);

            // LocalStorage Auto-Sync
            useEffect(() => {
                localStorage.setItem('app_auth_settings', JSON.stringify(authSettings));
            }, [authSettings]);

            useEffect(() => {
                localStorage.setItem('app_workers_master', JSON.stringify(workers));
            }, [workers]);

            useEffect(() => {
                localStorage.setItem('app_schedules_master', JSON.stringify(schedules));
            }, [schedules]);

            useEffect(() => {
                sessionStorage.setItem('app_is_authenticated', isAuthenticated ? 'true' : 'false');
            }, [isAuthenticated]);

            // --- KEYBOARD SHORTCUTS FOR COPY, PASTE, DELETE & UNDO (Ctrl+C / Ctrl+V / Delete / Ctrl+Z) ---
            useEffect(() => {
                const handleKeyDown = (e) => {
                    const activeElement = document.activeElement;
                    const tagName = activeElement ? activeElement.tagName.toUpperCase() : '';
                    const isInputing = tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT' || activeElement.isContentEditable;
                    
                    if (isInputing) return;

                    const isCmdOrCtrl = e.metaKey || e.ctrlKey;

                    // Ctrl + Z: Undo (元に戻す)
                    if (isCmdOrCtrl && e.key.toLowerCase() === 'z') {
                        e.preventDefault();
                        handleUndo();
                        return;
                    }

                    // Delete / Backspace: 選択した予定の削除
                    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedScheduleId) {
                        e.preventDefault();
                        handleDeleteSchedule(selectedScheduleId);
                        return;
                    }

                    // Ctrl + C: コピー
                    if (isCmdOrCtrl && e.key.toLowerCase() === 'c') {
                        if (selectedScheduleId) {
                            const target = schedules.find(s => s.id === selectedScheduleId);
                            if (target) {
                                e.preventDefault();
                                setCopiedSchedule(target);
                                showToast(`予定「${target.title}」をコピーしました。(Ctrl+V でセルに貼り付け可)`, 'info');
                            }
                        }
                    }

                    // Ctrl + V: 貼り付け
                    if (isCmdOrCtrl && e.key.toLowerCase() === 'v') {
                        if (copiedSchedule && activeCell) {
                            e.preventDefault();
                            handlePasteSchedule(copiedSchedule, activeCell.workerId, activeCell.timeSlot);
                        } else if (copiedSchedule && !activeCell) {
                            showToast(`貼り付け先のセル（作業員と時間帯）をクリックして選択してください`, 'error');
                        }
                    }

                    // Escape: 選択解除
                    if (e.key === 'Escape') {
                        setSelectedScheduleId(null);
                        setActiveCell(null);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedScheduleId, copiedSchedule, activeCell, schedules, historyStack]);

            // --- UNDO (Ctrl+Z) HANDLER ---
            const handleUndo = async () => {
                if (historyStack.length === 0) {
                    showToast('元に戻す操作履歴はありません', 'info');
                    return;
                }

                const lastAction = historyStack[historyStack.length - 1];
                setHistoryStack(prev => prev.slice(0, prev.length - 1));

                if (lastAction.type === 'ADD') {
                    // Undo an ADD operation: delete the added schedules
                    const removeIds = new Set(lastAction.addedSchedules.map(s => s.id));
                    setSchedules(prev => prev.filter(s => !removeIds.has(s.id)));
                    setSelectedScheduleId(null);

                    showToast(`「${lastAction.addedSchedules[0]?.title || '予定'}」の追加を取り消し(Undo)しました`);

                    if (supabase) {
                        try {
                            for (const sched of lastAction.addedSchedules) {
                                await supabase.from('schedules').update({ is_deleted: true }).eq('schedule_id', sched.id);
                            }
                            fetchSupabaseData();
                        } catch (err) {
                            console.error('Undo ADD error:', err);
                        }
                    }
                } else if (lastAction.type === 'UPDATE') {
                    // Undo an UPDATE operation: restore previous schedule
                    const prev = lastAction.prevSchedule;
                    setSchedules(prevList => prevList.map(s => s.id === prev.id ? prev : s));

                    showToast(`「${prev.title}」の編集を取り消し(Undo)しました`);

                    if (supabase) {
                        try {
                            await supabase.from('schedules').upsert({
                                schedule_id: String(prev.id),
                                work_date: prev.date,
                                worker_id: String(prev.workerId),
                                start_time: prev.startTime,
                                end_time: prev.endTime,
                                title: prev.title,
                                location: prev.location || '',
                                priority: prev.priority || 'medium',
                                status: prev.status || 'not_started',
                                notes: prev.notes || '',
                                is_deleted: false
                            });
                            fetchSupabaseData();
                        } catch (err) {
                            console.error('Undo UPDATE error:', err);
                        }
                    }
                } else if (lastAction.type === 'DELETE') {
                    // Undo a DELETE operation: restore deleted schedules
                    const restoreList = lastAction.deletedSchedules;
                    setSchedules(prevList => {
                        let updated = [...prevList];
                        restoreList.forEach(item => {
                            if (!updated.some(s => s.id === item.id)) {
                                updated.push(item);
                            }
                        });
                        return updated;
                    });

                    showToast(`「${restoreList[0]?.title || '予定'}」の削除を取り消し(Undo)・復元しました`);

                    if (supabase) {
                        try {
                            const dbPayloads = restoreList.map(item => ({
                                schedule_id: String(item.id),
                                work_date: item.date,
                                worker_id: String(item.workerId),
                                start_time: item.startTime,
                                end_time: item.endTime,
                                title: item.title,
                                location: item.location || '',
                                priority: item.priority || 'medium',
                                status: item.status || 'not_started',
                                notes: item.notes || '',
                                is_deleted: false
                            }));
                            await supabase.from('schedules').upsert(dbPayloads);
                            fetchSupabaseData();
                        } catch (err) {
                            console.error('Undo DELETE error:', err);
                        }
                    }
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                sessionStorage.removeItem('app_is_authenticated');
                showToast('ログアウトし、画面をロックしました', 'info');
            };

            // Single & Multi-Worker Schedule Save (Supports Multiple Workers At Once & Undo)
            const handleSaveSchedule = async (scheduleData, targetWorkerIds = []) => {
                const workerList = (targetWorkerIds && targetWorkerIds.length > 0) 
                    ? targetWorkerIds 
                    : [scheduleData.workerId];

                const isUpdate = Boolean(scheduleData.id && schedules.some(s => s.id === scheduleData.id));
                const previousSchedule = isUpdate ? schedules.find(s => s.id === scheduleData.id) : null;

                const newEntries = workerList.map((wId) => {
                    const targetId = (isUpdate && workerList.length === 1)
                        ? scheduleData.id
                        : 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                    return {
                        ...scheduleData,
                        id: targetId,
                        workerId: String(wId)
                    };
                });

                // Save action to history stack for Undo
                if (isUpdate && previousSchedule && workerList.length === 1) {
                    setHistoryStack(prev => [...prev.slice(-29), { type: 'UPDATE', prevSchedule: previousSchedule, newSchedule: newEntries[0] }]);
                } else {
                    setHistoryStack(prev => [...prev.slice(-29), { type: 'ADD', addedSchedules: newEntries }]);
                }

                // Update Local UI
                setSchedules(prev => {
                    let updated = [...prev];
                    newEntries.forEach(entry => {
                        const existsIdx = updated.findIndex(s => s.id === entry.id);
                        if (existsIdx >= 0) {
                            updated[existsIdx] = entry;
                        } else {
                            updated.push(entry);
                        }
                    });
                    return updated;
                });

                // Supabase Persistence
                if (supabase) {
                    try {
                        const dbPayloads = newEntries.map(entry => ({
                            schedule_id: String(entry.id),
                            work_date: entry.date,
                            worker_id: String(entry.workerId),
                            start_time: entry.startTime,
                            end_time: entry.endTime,
                            title: entry.title,
                            location: entry.location || '',
                            priority: entry.priority || 'medium',
                            status: entry.status || 'not_started',
                            notes: entry.notes || '',
                            is_deleted: false
                        }));

                        const { error } = await supabase.from('schedules').upsert(dbPayloads);

                        if (error) {
                            console.error('Supabase Upsert Error:', error);
                            showToast(`保存エラー: ${error.message}`, 'error');
                        } else {
                            showToast(`${newEntries.length}件の予定をSupabaseへ保存しました！ (Ctrl+Zで元に戻せます)`);
                            fetchSupabaseData();
                        }
                    } catch (err) {
                        console.error('Supabase Sync Exception:', err);
                        showToast(`保存例外エラー: ${err.message}`, 'error');
                    }
                } else {
                    showToast(`${newEntries.length}件の予定を保存しました (ローカル)`);
                }

                setIsModalOpen(false);
                setEditingSchedule(null);
            };

            // Direct Copy & Paste Helper (Supports Undo)
            const handlePasteSchedule = async (sourceSchedule, targetWorkerId, targetTimeSlot) => {
                if (!sourceSchedule) return;
                const duration = getDurationMinutes(sourceSchedule.startTime, sourceSchedule.endTime);
                const newEndTime = addMinutes(targetTimeSlot, duration);

                const newId = 's_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                const pastedEntry = {
                    ...sourceSchedule,
                    id: newId,
                    date: selectedDate,
                    workerId: String(targetWorkerId),
                    startTime: targetTimeSlot,
                    endTime: newEndTime,
                    status: 'not_started' // Copied entries start fresh
                };

                // Push to history for Undo
                setHistoryStack(prev => [...prev.slice(-29), { type: 'ADD', addedSchedules: [pastedEntry] }]);

                setSchedules(prev => [...prev, pastedEntry]);

                const targetWorker = workers.find(w => String(w.id) === String(targetWorkerId));
                showToast(`作業員「${targetWorker?.name || targetWorkerId}」に「${sourceSchedule.title}」を貼り付けました (Ctrl+Zで元に戻せます)`);

                if (supabase) {
                    try {
                        await supabase.from('schedules').upsert({
                            schedule_id: String(newId),
                            work_date: selectedDate,
                            worker_id: String(targetWorkerId),
                            start_time: targetTimeSlot,
                            end_time: newEndTime,
                            title: sourceSchedule.title,
                            location: sourceSchedule.location || '',
                            priority: sourceSchedule.priority || 'medium',
                            status: 'not_started',
                            notes: sourceSchedule.notes || '',
                            is_deleted: false
                        });
                    } catch (err) {
                        console.error('Paste Error:', err);
                    }
                }
            };

            const handleDeleteSchedule = async (id) => {
                const target = schedules.find(s => s.id === id);
                if (!target) return;

                // Push to history stack for Undo
                setHistoryStack(prev => [...prev.slice(-29), { type: 'DELETE', deletedSchedules: [target] }]);

                setSchedules(prev => prev.filter(s => s.id !== id));
                if (selectedScheduleId === id) setSelectedScheduleId(null);

                showToast(`予定「${target.title}」を削除しました (Ctrl+Zで元に戻せます)`);

                if (supabase) {
                    try {
                        const { error } = await supabase.from('schedules').update({ is_deleted: true }).eq('schedule_id', id);
                        if (error) {
                            showToast(`削除エラー: ${error.message}`, 'error');
                        } else {
                            fetchSupabaseData();
                        }
                    } catch (err) {
                        console.error('Supabase Delete Sync Error:', err);
                    }
                }
                setIsModalOpen(false);
                setEditingSchedule(null);
            };

            const handleSaveWorkersMaster = async (updatedWorkers) => {
                setWorkers(updatedWorkers);
                if (supabase) {
                    try {
                        const payload = updatedWorkers.map((w, idx) => ({
                            worker_id: String(w.id),
                            worker_code: String(w.id),
                            full_name: w.name,
                            role_name: w.role || '現場担当',
                            color_code: w.color || 'bg-blue-600',
                            display_order: idx + 1,
                            is_deleted: false
                        }));
                        const { error } = await supabase.from('workers').upsert(payload);
                        if (error) {
                            showToast(`マスタ更新エラー: ${error.message}`, 'error');
                        } else {
                            fetchSupabaseData();
                            showToast('作業員マスタをSupabaseへ更新保存しました');
                        }
                    } catch (err) {
                        console.error('Supabase Save Workers Error:', err);
                    }
                } else {
                    showToast('作業員マスタを更新しました');
                }
                setIsWorkerMasterOpen(false);
            };

            // Filter schedules for current date
            const currentDaySchedules = useMemo(() => {
                return schedules.filter(s => s.date === selectedDate);
            }, [schedules, selectedDate]);

            // Conflict warning map for active date
            const conflictsMap = useMemo(() => {
                const map = {};
                workers.forEach(w => {
                    const wSchedules = currentDaySchedules.filter(s => String(s.workerId) === String(w.id));
                    const conflictIds = new Set();
                    for (let i = 0; i < wSchedules.length; i++) {
                        for (let j = i + 1; j < wSchedules.length; j++) {
                            const s1 = wSchedules[i];
                            const s2 = wSchedules[j];
                            if (s1.startTime < s2.endTime && s2.startTime < s1.endTime) {
                                conflictIds.add(s1.id);
                                conflictIds.add(s2.id);
                            }
                        }
                    }
                    map[w.id] = Array.from(conflictIds);
                });
                return map;
            }, [currentDaySchedules, workers]);

            if (!isAuthenticated) {
                return (
                    <AuthScreen
                        authSettings={authSettings}
                        onSuccess={() => {
                            setIsAuthenticated(true);
                            showToast('本人認証に成功しました');
                        }}
                    />
                );
            }

            return (
                <div className="flex flex-col min-h-screen text-slate-800 bg-slate-100">
                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl border flex items-center gap-2.5 animate-in fade-in slide-in-from-bottom duration-200 text-xs sm:text-sm font-semibold max-w-md ${
                            toast.type === 'error' ? 'bg-red-900 border-red-700 text-red-100' : 'bg-slate-900 border-slate-700 text-white'
                        }`}>
                            <Icon name={toast.type === 'error' ? 'alert' : 'check'} className={`w-5 h-5 shrink-0 ${toast.type === 'error' ? 'text-red-400' : 'text-emerald-400'}`} />
                            <span className="break-all">{toast.message}</span>
                        </div>
                    )}

                    {/* --- FLOATING CLIPBOARD / SELECTION TOOLBAR --- */}
                    {copiedSchedule && (
                        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 bg-slate-900/95 border border-brand-500/80 text-white px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-3.5 text-xs backdrop-blur-md animate-in slide-in-from-bottom duration-200">
                            <div className="flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-brand-400 animate-ping" />
                                <Icon name="clipboard" className="w-4 h-4 text-brand-400" />
                                <div>
                                    <span className="text-slate-400 text-[11px]">コピー中: </span>
                                    <span className="font-bold text-brand-200">「{copiedSchedule.title}」</span>
                                    <span className="text-[10px] text-slate-400 ml-1 font-mono">({copiedSchedule.startTime}~{copiedSchedule.endTime})</span>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 border-l border-slate-700 pl-3">
                                <span className="hidden sm:inline-block text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded font-mono border border-slate-700">
                                    セル選択 + Ctrl+V または クリック貼り付け
                                </span>
                                <button
                                    onClick={() => setCopiedSchedule(null)}
                                    className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-[10px] font-bold transition"
                                >
                                    コピー解除
                                </button>
                            </div>
                        </div>
                    )}

                    {/* FLOATING ACTION TOOLBAR FOR SELECTED SCHEDULE (WHEN NO COPY IN BUFFER) */}
                    {selectedScheduleId && !copiedSchedule && (
                        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 bg-slate-900/95 border border-amber-500/80 text-white px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-3 text-xs backdrop-blur-md animate-in slide-in-from-bottom duration-200">
                            <div className="flex items-center gap-2">
                                <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse" />
                                <span className="font-bold text-amber-200">
                                    選択中: 「{schedules.find(s => s.id === selectedScheduleId)?.title || '予定'}」
                                </span>
                            </div>
                            <div className="flex items-center gap-2 border-l border-slate-700 pl-3">
                                <button
                                    onClick={() => {
                                        const target = schedules.find(s => s.id === selectedScheduleId);
                                        if (target) {
                                            setCopiedSchedule(target);
                                            showToast(`「${target.title}」をコピーしました。(Ctrl+V で貼り付け)`, 'info');
                                        }
                                    }}
                                    className="px-2.5 py-1 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-[11px] font-bold transition flex items-center gap-1 shadow-xs"
                                >
                                    <Icon name="copy" className="w-3.5 h-3.5" />
                                    コピー (Ctrl+C)
                                </button>
                                <button
                                    onClick={() => handleDeleteSchedule(selectedScheduleId)}
                                    className="px-2.5 py-1 bg-red-600 hover:bg-red-500 text-white rounded-lg text-[11px] font-bold transition flex items-center gap-1 shadow-xs"
                                >
                                    <Icon name="trash" className="w-3.5 h-3.5" />
                                    削除 (Delete)
                                </button>
                                <button
                                    onClick={() => setSelectedScheduleId(null)}
                                    className="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-[10px] transition"
                                >
                                    選択解除
                                </button>
                            </div>
                        </div>
                    )}

                    {/* --- HEADER --- */}
                    <header className="bg-slate-900 text-white shadow-lg sticky top-0 z-30 no-print">
                        <div className="max-w-[1700px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center space-x-3">
                                <div className="p-2 bg-brand-600 rounded-xl text-white shadow-md">
                                    <Icon name="users" className="w-6 h-6" />
                                </div>
                                <div>
                                    <h1 className="text-base sm:text-lg font-bold tracking-tight flex items-center gap-2">
                                        作業員一括Web予定表システム
                                        {dbConnected ? (
                                            <span className="text-xs bg-emerald-500/20 text-emerald-300 font-normal px-2.5 py-0.5 rounded-full border border-emerald-500/40 flex items-center gap-1">
                                                <Icon name="database" className="w-3.5 h-3.5 text-emerald-400" />
                                                Supabase DB接続完了
                                            </span>
                                        ) : (
                                            <span className="text-xs bg-amber-500/20 text-amber-300 font-normal px-2.5 py-0.5 rounded-full border border-amber-500/40 flex items-center gap-1">
                                                <Icon name="shield" className="w-3.5 h-3.5 text-amber-400" />
                                                接続処理中...
                                            </span>
                                        )}
                                    </h1>
                                    <p className="text-[11px] text-slate-400">予定のクリック選択・Ctrl+C/Vコピー・Delete削除・Ctrl+Z Undoに対応</p>
                                </div>
                            </div>

                            {/* Header Action Buttons */}
                            <div className="flex items-center flex-wrap gap-2">
                                <button
                                    onClick={() => {
                                        setEditingSchedule({
                                            date: selectedDate,
                                            workerId: workers[0]?.id || 'w1',
                                            startTime: '08:30',
                                            endTime: '12:00',
                                            priority: 'medium',
                                            status: 'not_started',
                                            category: 'work'
                                        });
                                        setIsModalOpen(true);
                                    }}
                                    className="bg-brand-600 hover:bg-brand-500 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-1.5 transition shadow-sm"
                                >
                                    <Icon name="plus" className="w-4 h-4" />
                                    <span>新規予定割当</span>
                                </button>

                                <button
                                    onClick={handleUndo}
                                    disabled={historyStack.length === 0}
                                    className={`px-3 py-2 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-1.5 transition border ${
                                        historyStack.length > 0
                                            ? 'bg-slate-800 hover:bg-slate-700 text-amber-300 border-amber-500/50 shadow-xs cursor-pointer'
                                            : 'bg-slate-800/40 text-slate-500 border-slate-800 cursor-not-allowed opacity-50'
                                    }`}
                                    title={historyStack.length > 0 ? "直前の操作を取り消す (Ctrl+Z)" : "元に戻す操作はありません"}
                                >
                                    <Icon name="undo" className="w-4 h-4 text-amber-400" />
                                    <span>元に戻す {historyStack.length > 0 ? `(${historyStack.length})` : ''}</span>
                                </button>

                                <button
                                    onClick={() => fetchSupabaseData()}
                                    className="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-1.5 transition"
                                    title="手動でSupabaseの最新データを再取得"
                                >
                                    <Icon name="database" className="w-4 h-4" />
                                    <span>データ再読み込み</span>
                                </button>

                                <button
                                    onClick={() => setIsWorkerMasterOpen(true)}
                                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-1.5 transition"
                                >
                                    <Icon name="settings" className="w-4 h-4 text-brand-400" />
                                    <span>作業員マスタ ({workers.length}名)</span>
                                </button>

                                <button
                                    onClick={() => setIsSecurityModalOpen(true)}
                                    className="bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-700 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-1.5 transition"
                                >
                                    <Icon name="fingerprint" className="w-4 h-4" />
                                    <span className="hidden md:inline">認証設定</span>
                                </button>

                                <button
                                    onClick={handleLogout}
                                    className="bg-red-950/50 hover:bg-red-900/80 text-red-300 border border-red-800/60 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium flex items-center gap-1.5 transition"
                                >
                                    <Icon name="lock" className="w-4 h-4" />
                                    <span>ロック</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* --- CONTROL BAR --- */}
                    <div className="bg-white border-b border-slate-200 shadow-xs no-print">
                        <div className="max-w-[1700px] mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
                            <div className="flex items-center space-x-2">
                                <button
                                    onClick={() => setSelectedDate(addDaysStr(selectedDate, -1))}
                                    className="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"
                                >
                                    <Icon name="chevronLeft" className="w-5 h-5" />
                                </button>
                                
                                <div className="flex items-center space-x-2 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200">
                                    <Icon name="calendar" className="w-4 h-4 text-brand-600" />
                                    <input
                                        type="date"
                                        value={selectedDate}
                                        onChange={(e) => setSelectedDate(e.target.value)}
                                        className="bg-transparent font-bold text-slate-800 text-sm outline-none cursor-pointer"
                                    />
                                </div>

                                <button
                                    onClick={() => setSelectedDate(addDaysStr(selectedDate, 1))}
                                    className="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition"
                                >
                                    <Icon name="chevronRight" className="w-5 h-5" />
                                </button>

                                <button
                                    onClick={() => setSelectedDate(getTodayString())}
                                    className="px-2.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg text-xs font-bold transition"
                                >
                                    本日
                                </button>

                                <span className="text-xs sm:text-sm font-semibold text-slate-600 ml-2 hidden sm:inline">
                                    {formatDateJP(selectedDate)}
                                </span>
                            </div>

                            <div className="flex items-center space-x-2">
                                <div className="relative hidden md:block">
                                    <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5" />
                                    <input
                                        type="text"
                                        placeholder="作業名・現場で検索..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="pl-8 pr-3 py-1.5 bg-slate-100 border border-slate-200 rounded-xl text-xs w-44 focus:ring-2 focus:ring-brand-500 outline-none"
                                    />
                                </div>

                                <div className="bg-slate-100 p-1 rounded-xl flex space-x-1 text-xs font-bold border border-slate-200">
                                    <button
                                        onClick={() => setCurrentView('timeline')}
                                        className={`px-3 py-1.5 rounded-lg transition flex items-center gap-1 ${
                                            currentView === 'timeline' ? 'bg-brand-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'
                                        }`}
                                    >
                                        <Icon name="users" className="w-3.5 h-3.5" />
                                        一括ボード
                                    </button>
                                    <button
                                        onClick={() => setCurrentView('matrix')}
                                        className={`px-3 py-1.5 rounded-lg transition flex items-center gap-1 ${
                                            currentView === 'matrix' ? 'bg-brand-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'
                                        }`}
                                    >
                                        <Icon name="grid" className="w-3.5 h-3.5" />
                                        週間マトリクス
                                    </button>
                                    <button
                                        onClick={() => setCurrentView('table')}
                                        className={`px-3 py-1.5 rounded-lg transition flex items-center gap-1 ${
                                            currentView === 'table' ? 'bg-brand-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'
                                        }`}
                                    >
                                        <Icon name="fileText" className="w-3.5 h-3.5" />
                                        予定一覧
                                    </button>
                                    <button
                                        onClick={() => setCurrentView('analytics')}
                                        className={`px-3 py-1.5 rounded-lg transition flex items-center gap-1 ${
                                            currentView === 'analytics' ? 'bg-brand-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'
                                        }`}
                                    >
                                        <Icon name="chart" className="w-3.5 h-3.5" />
                                        集計
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* --- MAIN CONTENT CONTAINER --- */}
                    <main className="flex-1 max-w-[1700px] w-full mx-auto p-3 sm:p-5">

                        {currentView === 'timeline' && (
                            <TimelineView
                                workers={workers}
                                schedules={currentDaySchedules}
                                searchQuery={searchQuery}
                                density={density}
                                conflictsMap={conflictsMap}
                                selectedDate={selectedDate}
                                selectedScheduleId={selectedScheduleId}
                                copiedSchedule={copiedSchedule}
                                activeCell={activeCell}
                                onSelectSchedule={(id) => setSelectedScheduleId(id)}
                                onCopySchedule={(sched) => {
                                    setCopiedSchedule(sched);
                                    showToast(`「${sched.title}」をコピーしました。(Ctrl+V で貼り付け)`, 'info');
                                }}
                                onCellClick={(workerId, timeSlot) => {
                                    setActiveCell({ workerId, timeSlot });
                                    if (copiedSchedule) {
                                        handlePasteSchedule(copiedSchedule, workerId, timeSlot);
                                    } else {
                                        setEditingSchedule({
                                            date: selectedDate,
                                            workerId,
                                            startTime: timeSlot,
                                            endTime: addMinutes(timeSlot, 120),
                                            priority: 'medium',
                                            status: 'not_started',
                                            category: 'work'
                                        });
                                        setIsModalOpen(true);
                                    }
                                }}
                                onScheduleClick={(schedule) => {
                                    setEditingSchedule(schedule);
                                    setIsModalOpen(true);
                                }}
                            />
                        )}

                        {currentView === 'matrix' && (
                            <MatrixView
                                workers={workers}
                                schedules={schedules}
                                selectedDate={selectedDate}
                                onSelectDate={(d) => {
                                    setSelectedDate(d);
                                    setCurrentView('timeline');
                                }}
                            />
                        )}

                        {currentView === 'table' && (
                            <TableView
                                workers={workers}
                                schedules={currentDaySchedules}
                                searchQuery={searchQuery}
                                onEdit={(sched) => {
                                    setEditingSchedule(sched);
                                    setIsModalOpen(true);
                                }}
                                onCopy={(sched) => {
                                    setCopiedSchedule(sched);
                                    showToast(`「${sched.title}」をコピーしました。`, 'info');
                                }}
                                onDelete={handleDeleteSchedule}
                            />
                        )}

                        {currentView === 'analytics' && (
                            <AnalyticsView
                                workers={workers}
                                schedules={currentDaySchedules}
                            />
                        )}
                    </main>

                    {/* --- MODALS --- */}
                    {isSecurityModalOpen && (
                        <SecuritySettingsModal
                            authSettings={authSettings}
                            onClose={() => setIsSecurityModalOpen(false)}
                            onSave={(updated) => {
                                setAuthSettings(updated);
                                showToast('セキュリティ認証設定を更新しました');
                                setIsSecurityModalOpen(false);
                            }}
                        />
                    )}

                    {isModalOpen && (
                        <ScheduleEditModal
                            schedule={editingSchedule}
                            workers={workers}
                            onClose={() => setIsModalOpen(false)}
                            onSave={handleSaveSchedule}
                            onDelete={handleDeleteSchedule}
                        />
                    )}

                    {isWorkerMasterOpen && (
                        <WorkerMasterModal
                            workers={workers}
                            onClose={() => setIsWorkerMasterOpen(false)}
                            onSave={handleSaveWorkersMaster}
                        />
                    )}

                    {isExportModalOpen && (
                        <ExportModal
                            schedules={schedules}
                            workers={workers}
                            onClose={() => setIsExportModalOpen(false)}
                            onImport={(importedSchedules) => {
                                setSchedules(importedSchedules);
                                showToast('データを正常にインポートしました');
                                setIsExportModalOpen(false);
                            }}
                        />
                    )}
                </div>
            );
        }

        // --- AUTHENTICATION SCREEN COMPONENT ---
        function AuthScreen({ authSettings, onSuccess }) {
            const [mode, setMode] = useState(authSettings.useBiometrics ? 'biometric' : '2fa');
            const [pinInput, setPinInput] = useState('');
            const [otpInput, setOtpInput] = useState('');
            const [step2FA, setStep2FA] = useState('pin');
            const [isScanning, setIsScanning] = useState(false);
            const [authError, setAuthError] = useState('');
            const [generatedOTP, setGeneratedOTP] = useState('');
            const [otpTimer, setOtpTimer] = useState(60);

            useEffect(() => {
                let timer;
                if (step2FA === 'otp' && otpTimer > 0) {
                    timer = setInterval(() => setOtpTimer(prev => prev - 1), 1000);
                }
                return () => clearInterval(timer);
            }, [step2FA, otpTimer]);

            const handleBiometricAuth = async () => {
                setIsScanning(true);
                setAuthError('');

                try {
                    if (window.PublicKeyCredential && navigator.credentials && navigator.credentials.get) {
                        try {
                            const dummyChallenge = new Uint8Array(32);
                            window.crypto.getRandomValues(dummyChallenge);
                            await navigator.credentials.get({
                                publicKey: {
                                    challenge: dummyChallenge,
                                    timeout: 60000,
                                    userVerification: "preferred"
                                }
                            });
                        } catch (e) {
                            console.warn('Native WebAuthn prompt note:', e);
                        }
                    }

                    setTimeout(() => {
                        setIsScanning(false);
                        onSuccess();
                    }, 1200);
                } catch (err) {
                    setIsScanning(false);
                    setAuthError('生体認証に失敗しました。PINコードをご利用ください。');
                }
            };

            const handlePinSubmit = (e) => {
                e.preventDefault();
                setAuthError('');
                if (pinInput === authSettings.pin) {
                    if (authSettings.use2FA) {
                        const code = Math.floor(100000 + Math.random() * 900000).toString();
                        setGeneratedOTP(code);
                        setOtpTimer(60);
                        setStep2FA('otp');
                    } else {
                        onSuccess();
                    }
                } else {
                    setAuthError('暗証番号(PIN)が一致しません (初期設定: 1234)');
                }
            };

            const handleOtpSubmit = (e) => {
                e.preventDefault();
                setAuthError('');
                if (otpInput === generatedOTP || otpInput === '888888') {
                    onSuccess();
                } else {
                    setAuthError('ワンタイム認証コードが正しくありません');
                }
            };

            return (
                <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 relative overflow-hidden">
                    <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-brand-600/20 rounded-full blur-3xl pointer-events-none" />
                    <div className="absolute bottom-10 right-10 w-72 h-72 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none" />

                    <div className="relative w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl text-white z-10">
                        <div className="text-center space-y-2 mb-6">
                            <div className="inline-flex p-3 bg-brand-600/20 border border-brand-500/30 rounded-2xl text-brand-400 mb-1">
                                <Icon name="shield" className="w-8 h-8" />
                            </div>
                            <h2 className="text-xl font-extrabold tracking-tight">作業員一括Web予定表</h2>
                            <p className="text-xs text-slate-400">
                                セキュリティ保護されています。<br />生体認証または2段階認証でアクセスしてください。
                            </p>
                        </div>

                        {authError && (
                            <div className="mb-5 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs flex items-start gap-2 animate-shake">
                                <Icon name="alert" className="w-4 h-4 text-red-400 shrink-0 mt-0.5" />
                                <div>{authError}</div>
                            </div>
                        )}

                        <div className="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl mb-6 text-xs font-bold border border-slate-800">
                            <button
                                type="button"
                                onClick={() => { setMode('biometric'); setAuthError(''); }}
                                className={`py-2 rounded-lg flex items-center justify-center gap-1.5 transition ${
                                    mode === 'biometric' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                <Icon name="fingerprint" className="w-4 h-4" />
                                スマホ生体認証
                            </button>
                            <button
                                type="button"
                                onClick={() => { setMode('2fa'); setStep2FA('pin'); setAuthError(''); }}
                                className={`py-2 rounded-lg flex items-center justify-center gap-1.5 transition ${
                                    mode === '2fa' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                <Icon name="key" className="w-4 h-4" />
                                2段階認証 (PIN+OTP)
                            </button>
                        </div>

                        {mode === 'biometric' && (
                            <div className="text-center space-y-6 py-2">
                                <div className="relative inline-flex items-center justify-center">
                                    <button
                                        type="button"
                                        onClick={handleBiometricAuth}
                                        disabled={isScanning}
                                        className={`w-28 h-28 rounded-3xl border-2 flex flex-col items-center justify-center gap-2 transition duration-300 relative overflow-hidden ${
                                            isScanning 
                                                ? 'border-emerald-400 bg-emerald-500/10 text-emerald-400 animate-pulse' 
                                                : 'border-brand-500/60 bg-brand-500/10 hover:bg-brand-500/20 text-brand-400 hover:scale-105'
                                        }`}
                                    >
                                        <Icon name="fingerprint" className="w-12 h-12" />
                                        <span className="text-[10px] font-extrabold tracking-wider uppercase">
                                            {isScanning ? '照合中...' : 'Face ID / Touch ID'}
                                        </span>
                                    </button>
                                </div>

                                <div className="space-y-1">
                                    <p className="text-xs font-bold text-slate-200">画面の生体キーをタップして認証を試行</p>
                                    <p className="text-[11px] text-slate-400">iOS (Face ID/Touch ID) / Android (指紋・顔) 対応</p>
                                </div>

                                <button
                                    type="button"
                                    onClick={handleBiometricAuth}
                                    className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-2"
                                >
                                    <Icon name="smartphone" className="w-4 h-4" />
                                    生体認証でログインを開始
                                </button>
                            </div>
                        )}

                        {mode === '2fa' && (
                            <div>
                                {step2FA === 'pin' ? (
                                    <form onSubmit={handlePinSubmit} className="space-y-4 text-xs">
                                        <div>
                                            <label className="block text-slate-300 font-bold mb-1.5 flex items-center gap-1.5">
                                                <Icon name="lock" className="w-4 h-4 text-brand-400" />
                                                暗証番号 (PIN) を入力
                                            </label>
                                            <input
                                                type="password"
                                                maxLength="8"
                                                required
                                                autoFocus
                                                value={pinInput}
                                                onChange={(e) => setPinInput(e.target.value)}
                                                placeholder="暗証番号を入力 (初期: 1234)"
                                                className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-center text-lg font-mono tracking-widest text-white focus:ring-2 focus:ring-brand-500 focus:outline-none"
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            className="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition shadow-lg text-xs"
                                        >
                                            次へ (ワンタイム認証コード発行)
                                        </button>
                                    </form>
                                ) : (
                                    <form onSubmit={handleOtpSubmit} className="space-y-4 text-xs">
                                        <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-emerald-300 text-xs text-center space-y-1">
                                            <div className="font-bold flex items-center justify-center gap-1">
                                                <Icon name="smartphone" className="w-4 h-4" />
                                                2段階認証コードを発行しました
                                            </div>
                                            <div className="text-xl font-mono font-extrabold tracking-widest text-emerald-400">
                                                {generatedOTP}
                                            </div>
                                            <div className="text-[10px] opacity-80">
                                                ※デモ用コードを表示中 (有効期限: {otpTimer}秒)
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-slate-300 font-bold mb-1.5">
                                                6桁のワンタイムコードを入力
                                            </label>
                                            <input
                                                type="text"
                                                maxLength="6"
                                                required
                                                autoFocus
                                                value={otpInput}
                                                onChange={(e) => setOtpInput(e.target.value)}
                                                placeholder="6桁コードを入力"
                                                className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-center text-lg font-mono tracking-widest text-white focus:ring-2 focus:ring-brand-500 focus:outline-none"
                                            />
                                        </div>

                                        <div className="flex gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setStep2FA('pin')}
                                                className="w-1/3 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs"
                                            >
                                                戻る
                                            </button>
                                            <button
                                                type="submit"
                                                className="w-2/3 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow-lg text-xs"
                                            >
                                                認証してログイン
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        )}

                        <div className="mt-6 pt-4 border-t border-slate-800 text-center text-[11px] text-slate-500">
                            作業員一括管理システム Security v2.5
                        </div>
                    </div>
                </div>
            );
        }

        // --- TIMELINE VIEW ---
        function TimelineView({ workers, schedules, searchQuery, density, conflictsMap, selectedDate, selectedScheduleId, copiedSchedule, activeCell, onSelectSchedule, onCopySchedule, onCellClick, onScheduleClick }) {
            const filteredWorkers = useMemo(() => {
                if (!searchQuery) return workers;
                const q = searchQuery.toLowerCase();
                return workers.filter(w => {
                    const matchWorker = w.name.toLowerCase().includes(q) || w.role.toLowerCase().includes(q);
                    const hasMatchingSchedule = schedules.some(s => String(s.workerId) === String(w.id) && (s.title.toLowerCase().includes(q) || (s.location && s.location.toLowerCase().includes(q))));
                    return matchWorker || hasMatchingSchedule;
                });
            }, [workers, schedules, searchQuery]);

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div className="p-3 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs font-bold text-slate-600">
                        <div className="flex items-center space-x-2">
                            <span className="bg-brand-100 text-brand-800 px-2.5 py-0.5 rounded-md border border-brand-200">
                                当日配置作業員: {filteredWorkers.length}名
                            </span>
                            <span className="text-slate-400">|</span>
                            <span className="text-slate-600 flex items-center gap-1 flex-wrap">
                                <Icon name="copy" className="w-3.5 h-3.5 text-brand-600 shrink-0" />
                                クリック選択 ➔ <kbd className="bg-slate-200 text-slate-800 px-1 py-0.5 rounded font-mono text-[10px]">Delete</kbd> 削除 / <kbd className="bg-slate-200 text-slate-800 px-1 py-0.5 rounded font-mono text-[10px]">Ctrl+C</kbd> コピー / <kbd className="bg-slate-200 text-slate-800 px-1 py-0.5 rounded font-mono text-[10px]">Ctrl+V</kbd> 貼り付け / <kbd className="bg-slate-200 text-slate-800 px-1 py-0.5 rounded font-mono text-[10px]">Ctrl+Z</kbd> Undo
                            </span>
                        </div>
                        <div className="flex items-center space-x-3 text-[11px]">
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 完了</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-brand-500"></span> 作業中</span>
                            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-slate-400"></span> 未着手</span>
                        </div>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full border-collapse text-left text-xs min-w-[1100px]">
                            <thead>
                                <tr className="bg-slate-800 text-slate-200 uppercase font-semibold border-b border-slate-700">
                                    <th className="py-2.5 px-3 sticky left-0 bg-slate-800 z-20 w-48 border-r border-slate-700 shadow-sm">
                                        作業員氏名・職種 ({filteredWorkers.length}名)
                                    </th>
                                    {TIME_SLOTS.map(slot => (
                                        <th key={slot} className="py-2 px-1 text-center font-mono border-r border-slate-700/60 min-w-[70px]">
                                            {slot}
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                                {filteredWorkers.map((worker) => {
                                    const workerSchedules = schedules.filter(s => String(s.workerId) === String(worker.id));
                                    const hasConflict = (conflictsMap[worker.id] || []).length > 0;
                                    const rowPadding = density === 'compact' ? 'py-1' : 'py-2.5';

                                    return (
                                        <tr key={worker.id} className="hover:bg-slate-50/80 transition group">
                                            <td className={`px-3 ${rowPadding} sticky left-0 bg-white group-hover:bg-slate-50 border-r border-slate-200 z-10 font-medium`}>
                                                <div className="flex items-center justify-between">
                                                    <div className="flex items-center space-x-2 overflow-hidden">
                                                        <span className={`w-2.5 h-7 rounded-full shrink-0 ${worker.color}`} />
                                                        <div className="truncate">
                                                            <div className="font-bold text-slate-900 leading-tight truncate flex items-center gap-1">
                                                                {worker.name}
                                                                {hasConflict && (
                                                                    <span className="bg-red-500 text-white text-[9px] px-1 py-0.2 rounded font-bold animate-pulse">
                                                                        重複
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <div className="text-[10px] text-slate-500 truncate">{worker.role}</div>
                                                        </div>
                                                    </div>
                                                    <span className="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-mono shrink-0 ml-1">
                                                        {workerSchedules.length}件
                                                    </span>
                                                </div>
                                            </td>

                                            {TIME_SLOTS.map((slot) => {
                                                const slotHour = parseInt(slot.split(':')[0], 10);
                                                const matches = workerSchedules.filter(s => {
                                                    const startH = parseInt(s.startTime.split(':')[0], 10);
                                                    const endH = parseInt(s.endTime.split(':')[0], 10);
                                                    return slotHour >= startH && slotHour < endH;
                                                });

                                                const isCellActive = activeCell && String(activeCell.workerId) === String(worker.id) && activeCell.timeSlot === slot;

                                                return (
                                                    <td
                                                        key={slot}
                                                        onClick={() => onCellClick(worker.id, slot)}
                                                        className={`border-r border-slate-200/70 p-0.5 relative cursor-pointer hover:bg-brand-50/60 transition ${
                                                            density === 'compact' ? 'h-9' : 'h-14'
                                                        } ${isCellActive ? 'selected-cell' : ''}`}
                                                    >
                                                        {matches.map(sched => {
                                                            const isStart = parseInt(sched.startTime.split(':')[0], 10) === slotHour;
                                                            const isSelected = selectedScheduleId === sched.id;
                                                            const isCopied = copiedSchedule && copiedSchedule.id === sched.id;

                                                            let statusBg = "bg-slate-600 text-white";
                                                            if (sched.status === 'completed') statusBg = "bg-emerald-600 text-white";
                                                            if (sched.status === 'in_progress') statusBg = "bg-brand-600 text-white";

                                                            return (
                                                                <div
                                                                    key={sched.id}
                                                                    onClick={(e) => {
                                                                        e.stopPropagation();
                                                                        onSelectSchedule(sched.id);
                                                                    }}
                                                                    onDoubleClick={(e) => {
                                                                        e.stopPropagation();
                                                                        onScheduleClick(sched);
                                                                    }}
                                                                    className={`w-full h-full p-1 rounded-md text-[10px] leading-tight font-medium overflow-hidden shadow-2xs hover:scale-[1.02] transition relative group/card ${statusBg} ${
                                                                        isSelected ? 'ring-2 ring-yellow-400 ring-offset-1 z-10' : ''
                                                                    } ${isCopied ? 'copied-ring' : ''}`}
                                                                >
                                                                    <div className="flex items-center justify-between w-full">
                                                                        {isStart ? (
                                                                            <div className="font-bold truncate flex-1">
                                                                                {sched.startTime} {sched.title}
                                                                            </div>
                                                                        ) : (
                                                                            <div className="opacity-75 truncate text-[9px] flex-1">
                                                                                ➔ {sched.title}
                                                                            </div>
                                                                        )}

                                                                        {/* QUICK COPY BUTTON ON HOVER */}
                                                                        <button
                                                                            type="button"
                                                                            onClick={(e) => {
                                                                                e.stopPropagation();
