                                                                                onCopySchedule(sched);
                                                                            }}
                                                                            title="コピー (Ctrl+C)"
                                                                            className="hidden group-hover/card:flex items-center justify-center p-0.5 bg-black/40 hover:bg-black/70 rounded text-white ml-0.5 shrink-0 transition"
                                                                        >
                                                                            <Icon name="copy" className="w-3 h-3" />
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}

                                                        {/* PLACEHOLDER WHEN CELL IS CLICKED AND COPY IN BUFFER */}
                                                        {matches.length === 0 && copiedSchedule && isCellActive && (
                                                            <div className="w-full h-full flex items-center justify-center text-[9px] text-brand-600 font-bold bg-brand-50 rounded border border-brand-300">
                                                                貼り付け
                                                            </div>
                                                        )}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- WEEKLY MATRIX VIEW ---
        function MatrixView({ workers, schedules, selectedDate, onSelectDate }) {
            const weekDays = useMemo(() => {
                const result = [];
                for (let i = -3; i <= 3; i++) {
                    result.push(addDaysStr(selectedDate, i));
                }
                return result;
            }, [selectedDate]);

            return (
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="p-3 bg-slate-50 border-b border-slate-200 font-bold text-xs text-slate-700 flex justify-between items-center">
                        <span>全作業員 週間マトリクス・密度確認</span>
                        <span className="text-[11px] text-slate-500">日付セル選択でその日のタイムライン表示に移動します</span>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs min-w-[900px]">
                            <thead>
                                <tr className="bg-slate-800 text-slate-200">
                                    <th className="p-3 w-48 border-r border-slate-700">作業員</th>
                                    {weekDays.map(d => (
                                        <th
                                            key={d}
                                            onClick={() => onSelectDate(d)}
                                            className={`p-2.5 text-center cursor-pointer hover:bg-slate-700 transition ${
                                                d === selectedDate ? 'bg-brand-700 font-extrabold text-white' : ''
                                            }`}
                                        >
                                            {formatDateJP(d)}
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                                {workers.map(w => (
                                    <tr key={w.id} className="hover:bg-slate-50">
                                        <td className="p-2.5 font-bold text-slate-800 border-r border-slate-200">
                                            <div>{w.name}</div>
                                            <div className="text-[10px] text-slate-500 font-normal">{w.role}</div>
                                        </td>
                                        {weekDays.map(d => {
                                            const dayScheds = schedules.filter(s => String(s.workerId) === String(w.id) && s.date === d);
                                            return (
                                                <td

                    (s.location && s.location.toLowerCase().includes(q)) ||
                    getWorkerName(s.workerId).toLowerCase().includes(q)

            }, [schedules, searchQuery, workers]);

        // --- MODAL: EDIT & MULTI-ASSIGN SCHEDULE ---
        function ScheduleEditModal({ schedule, workers, onClose, onSave, onDelete }) {
            const [form, setForm] = useState({
                id: schedule?.id || null,
                date: schedule?.date || getTodayString(),
                workerId: schedule?.workerId || workers[0]?.id || 'w1',
                startTime: schedule?.startTime || '08:30',
                endTime: schedule?.endTime || '10:30',
                title: schedule?.title || '',
                location: schedule?.location || '',
                priority: schedule?.priority || 'medium',
                status: schedule?.status || 'not_started',
                notes: schedule?.notes || ''
            });

            // Multi-Worker Assignment Selection
            const [selectedWorkerIds, setSelectedWorkerIds] = useState([schedule?.workerId || workers[0]?.id || 'w1']);
            const [isMultiAssign, setIsMultiAssign] = useState(false);

            const handleToggleWorker = (wId) => {
                if (selectedWorkerIds.includes(wId)) {
                    if (selectedWorkerIds.length === 1) return; // keep at least 1
                    setSelectedWorkerIds(selectedWorkerIds.filter(id => id !== wId));
                } else {
                    setSelectedWorkerIds([...selectedWorkerIds, wId]);
                }
            };

            const handleSelectAllWorkers = () => {
                if (selectedWorkerIds.length === workers.length) {
                    setSelectedWorkerIds([form.workerId]);
                } else {
                    setSelectedWorkerIds(workers.map(w => w.id));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!form.title.trim()) return;
                
                const targets = isMultiAssign ? selectedWorkerIds : [form.workerId];
                onSave(form, targets);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-150">

                        </div>

                                <div>
                                    <label className="block text-slate-700 font-bold mb-1">対象日付</label>
                                    <input
                                        type="date"
                                        required
                                        value={form.date}
                                        onChange={(e) => setForm({ ...form, date: e.target.value })}
                                        className="w-full border border-slate-300 rounded-lg p-2 font-bold focus:ring-2 focus:ring-brand-500"
                                    />
                                </div>

                                <div>
                                    <div className="flex justify-between items-center mb-1">
                                        <label className="block text-slate-700 font-bold">割当作業員</label>

                                            <button

                                            >
                                                {isMultiAssign ? '単一選択に戻す' : '👥 複数人に同時一括割り当て'}
                                            </button>
                                        )}
                                    </div>

                                    {!isMultiAssign ? (
                                        <select
                                            value={form.workerId}
                                            onChange={(e) => {
                                                setForm({ ...form, workerId: e.target.value });
                                                setSelectedWorkerIds([e.target.value]);
                                            }}
                                            className="w-full border border-slate-300 rounded-lg p-2 font-bold focus:ring-2 focus:ring-brand-500"
                                        >
                                            {workers.map(w => (
                                                <option key={w.id} value={w.id}>{w.name} ({w.role})</option>
                                            ))}
                                        </select>
                                    ) : (
                                        <button
                                            type="button"
                                            onClick={handleSelectAllWorkers}
                                            className="w-full py-1.5 px-2 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg text-slate-700 font-bold text-left flex justify-between items-center"
                                        >
                                            <span>全 {selectedWorkerIds.length} 名が選択中</span>
                                            <span className="text-[10px] text-brand-600 font-mono">
                                                {selectedWorkerIds.length === workers.length ? '全解除' : '全選択'}
                                            </span>
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* MULTI ASSIGNMENT WORKER SELECTOR LIST */}

                                <div className="p-3 bg-brand-50/60 border border-brand-200 rounded-xl space-y-2">
                                    <div className="font-bold text-brand-900 text-[11px] flex justify-between items-center">
                                        <span>同時割当の対象作業員を選択してください ({selectedWorkerIds.length}名)</span>
                                    </div>
                                    <div className="max-h-36 overflow-y-auto grid grid-cols-2 gap-1.5 pr-1">
                                        {workers.map(w => {
                                            const isChecked = selectedWorkerIds.includes(w.id);
                                            return (
                                                <label
                                                    key={w.id}
                                                    className={`p-1.5 rounded-lg border text-[11px] flex items-center justify-between cursor-pointer transition ${
                                                        isChecked ? 'bg-brand-600 text-white border-brand-700 font-bold' : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
                                                    }`}
                                                >
                                                    <span className="truncate">{w.name}</span>
                                                    <input
                                                        type="checkbox"
                                                        checked={isChecked}
                                                        onChange={() => handleToggleWorker(w.id)}
                                                        className="ml-1 rounded text-brand-600 focus:ring-brand-500"
                                                    />
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-slate-700 font-bold mb-1">開始時間</label>
                                    <input
                                        type="time"
                                        required
                                        value={form.startTime}

                                    />

                                    />
                                </div>
                            </div>

                            <div>
                                <label className="block text-slate-700 font-bold mb-1">作業件名 / 内容 *</label>
                                <input
                                    type="text"
                                    required
                                    placeholder="例: 2F 配線引き込み工事"
                                    value={form.title}
                                    onChange={(e) => setForm({ ...form, title: e.target.value })}
                                    className="w-full border border-slate-300 rounded-lg p-2.5 font-bold focus:ring-2 focus:ring-brand-500"
                                />
                            </div>

                            <div className="grid grid-cols-3 gap-3">
                                <div>
                                    <label className="block text-slate-700 font-bold mb-1">施工場所</label>
                                    <input
                                        type="text"
                                        placeholder="例: 2F 電気室"
                                        value={form.location}
                                        onChange={(e) => setForm({ ...form, location: e.target.value })}
                                        className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-brand-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-slate-700 font-bold mb-1">優先度</label>
                                    <select
                                        value={form.priority}
                                        onChange={(e) => setForm({ ...form, priority: e.target.value })}

                                        <option value="high">高 (最優先)</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-slate-700 font-bold mb-1">進捗状況</label>

                                    >
                                        <option value="not_started">未着手</option>
                                        <option value="in_progress">作業中</option>
                                        <option value="completed">完了</option>
                                    </select>

                            <div>
                                <label className="block text-slate-700 font-bold mb-1">安全注意事項・備考</label>
                                <textarea
                                    rows="2"

                                    onChange={(e) => setForm({ ...form, notes: e.target.value })}
                                    className="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-brand-500"
                                />
                            </div>

                            <div className="pt-3 border-t border-slate-200 flex justify-between items-center">
                                {form.id ? (
                                    <button
                                        type="button"
                                        onClick={() => onDelete(form.id)}

                                        削除

                                        キャンセル

                                        {isMultiAssign ? `${selectedWorkerIds.length}名にまとめて保存` : '保存する'}

                                        checked={form.useBiometrics}
                                        onChange={(e) => setForm({ ...form, useBiometrics: e.target.checked })}
                                        className="w-4 h-4 text-brand-600 rounded focus:ring-brand-500"
                                    />
                                </label>

                                <hr className="border-slate-200" />

                                <label className="flex items-center justify-between cursor-pointer">
                                    <div>
                                        <div className="font-bold text-slate-900 flex items-center gap-1.5">
                                            <Icon name="key" className="w-4 h-4 text-brand-600" />
                                            2段階認証 (OTPコード入力)
                                        </div>
                                        <div className="text-[11px] text-slate-500">暗証番号の入力後にワンタイムコード出力を要求します</div>
                                    </div>
                                    <input
                                        type="checkbox"
                                        checked={form.use2FA}
                                        onChange={(e) => setForm({ ...form, use2FA: e.target.checked })}
                                        className="w-4 h-4 text-brand-600 rounded focus:ring-brand-500"
                                    />
                                </label>
                            </div>

                            <div>
                                <label className="block text-slate-700 font-bold mb-1">暗証番号 (PIN) の変更</label>
                                <input
                                    type="text"
                                    maxLength="8"
                                    value={newPin}
                                    onChange={(e) => setNewPin(e.target.value)}
                                    className="w-full border border-slate-300 rounded-lg p-2 font-mono font-bold text-slate-800 focus:ring-2 focus:ring-brand-500"
                                />
                                <span className="text-[10px] text-slate-400">※ログイン認証時に使用する4〜8桁の暗証番号です</span>
                            </div>

                            <div className="pt-3 border-t border-slate-200 flex justify-end gap-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 border rounded-lg text-slate-700 font-bold">キャンセル</button>
                                <button type="submit" className="px-5 py-2 bg-brand-600 text-white rounded-lg font-bold hover:bg-brand-500">設定変更を保存</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- MODAL: EXPORT / IMPORT DATA ---
        function ExportModal({ schedules, workers, onClose, onImport }) {
            const handleExportJSON = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ schedules, workers }));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `schedule_backup_${getTodayString()}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            };

            const handleFileImport = (e) => {
                const fileReader = new FileReader();
                if (e.target.files[0]) {
                    fileReader.readAsText(e.target.files[0], "UTF-8");
                    fileReader.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed.schedules && Array.isArray(parsed.schedules)) {
                                onImport(parsed.schedules);
                            }
                        } catch (err) {
                            alert('バックアップファイルの形式が正しくありません');
                        }
                    };
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                    <div className="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden">
                        <div className="bg-slate-900 text-white px-5 py-3.5 flex items-center justify-between">
                            <h3 className="font-bold text-sm sm:text-base flex items-center gap-2">
                                <Icon name="download" className="w-5 h-5 text-brand-400" />
                                データのバックアップ・復元
                            </h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white font-bold">✕</button>
                        </div>

                        <div className="p-5 space-y-4 text-xs">
                            <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                <div className="font-bold text-slate-800">1. JSONファイルでバックアップ出力</div>
                                <p className="text-slate-500">全期間の全作業員の予定データを保存します</p>
                                <button
                                    onClick={handleExportJSON}
                                    className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-lg flex items-center justify-center gap-1.5"
                                >
                                    <Icon name="download" className="w-4 h-4" />
                                    JSONデータをダウンロード
                                </button>
                            </div>

                            <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                                <div className="font-bold text-slate-800">2. バックアップファイルから復元</div>
                                <p className="text-slate-500">保存したJSONを選択してデータを読み込みます</p>
                                <input
                                    type="file"
                                    accept=".json"
                                    onChange={handleFileImport}
                                    className="w-full text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-brand-100 file:text-brand-800 hover:file:bg-brand-200"
                                />
                            </div>

                            <div className="pt-2 flex justify-end">
                                <button onClick={onClose} className="px-4 py-2 border rounded-lg font-bold text-slate-700">閉じる</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render React Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
